# Bank payload configuration for the generated Zephyr-80 image.
#
# Bank 0: firmware.bin (CP/M system, BIOS, and VDrip font at 0x8000 TPA).
#         The font is part of the firmware binary assembled at VDRIP_FONT_ROM_BASE.
#
# Banks 1-3: the read-only ROM disk that backs drive A:.
#
#   MEM_DECODER.pld only exposes ROM at 0000h-BFFFh, and only while shadow/copy
#   mode is set: C000h-FFFFh is forced to SRAM bank 0 (FORCE_BANK0).  So each
#   page contributes 48 KiB starting at offset 0, the top 16 KiB of each page is
#   unreachable and stays empty, and the volume is split across pages rather
#   than being one contiguous blob.  cbios_storage_rom.asm maps a CP/M record
#   back to (page, offset) with the same 0C000h stride.
#
#   entry must be 0000h.  The image tool's default is 0100h, which is right for
#   a bank holding a runnable .COM and wrong for a filesystem image.
#
#   Chunks come from tools/build_rom_disk.py; run `make rom-disk` to refresh
#   them.  Keep bank N here matched to ROMDISK_FIRST_PAGE + N - 1 in
#   cbios_defs.inc, and the count matched to ROMDISK_PAGE_COUNT.
#
# Banks 4-7: empty (zeroed by default in the image).

[payload.romdisk_page1]
name = ROM disk page 1
bank = 1
entry = 0000h
path = build/romdisk.p1.bin

[payload.romdisk_page2]
name = ROM disk page 2
bank = 2
entry = 0000h
path = build/romdisk.p2.bin

[payload.romdisk_page3]
name = ROM disk page 3
bank = 3
entry = 0000h
path = build/romdisk.p3.bin

# Bank 4: the executable-ROM service page.
#
#   Phase 2 of docs/Zephyr80_Executable_ROM_Service_Architecture.md.  The
#   resident gate (ROM_GATE, src/cbios_rom_gate.asm) selects this page in
#   shadow/copy mode and calls ROMSVC_ENTRY inside it, so the page is executed
#   in place rather than copied anywhere.
#
#   entry must be 0000h.  Like the ROM disk pages this is not a runnable .COM;
#   the tool's 0100h default would describe it wrongly.  The service entry point
#   happens to be at offset 0100h, but that is ROMSVC_ENTRY in romsvc_abi.inc,
#   not this field.
#
#   Keep bank 4 matched to ROMSVC_PAGE in src/romsvc_abi.inc.

[payload.romservices]
name = ROM service page
bank = 4
entry = 0000h
path = build/romservices.bin
