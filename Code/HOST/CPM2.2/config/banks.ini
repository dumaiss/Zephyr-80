# Explicit ROM page roles. SRAM destinations exist only for boot images.
# Page 0 (implicit firmware.bin) -> SRAM 0; page 7 -> SRAM 7, full 64 KiB.
# Pages 1-3: 48 KiB filesystem payload each; the unused upper 16 KiB is
# outside the volume and may hold the seven-byte ROM-read primitive.
# Pages 4-6: unused. SRAM banks 1-6 are not seeded at cold boot.

[payload.romdisk_page1]
kind = romdisk
name = ROM disk page 1
bank = 1
entry = 0000h
path = build/romdisk.p1.bin

[payload.romdisk_page2]
kind = romdisk
name = ROM disk page 2
bank = 2
entry = 0000h
path = build/romdisk.p2.bin

[payload.romdisk_page3]
kind = romdisk
name = ROM disk page 3
bank = 3
entry = 0000h
path = build/romdisk.p3.bin

[payload.os_bank7]
kind = boot
ram_bank = 7
name = OS bank 7
bank = 7
entry = 0000h
path = build/bank7.bin
