# Bank payload configuration for the generated Zephyr-80 image.
#
# No ROM bank payloads are required with the current build.
#
# Bank 0: firmware.bin (CP/M system, BIOS, and VDrip font at 0x8000 TPA).
#         The font is part of the firmware binary assembled at VDRIP_FONT_ROM_BASE.
#         Monitor and BBC BASIC are on the VDrip proxy storage image, not in ROM.
#
# Banks 1-7: empty (zeroed by default in the image).
