# Bank payload configuration for the generated Zephyr-80 image.
#
# Each [payload.<id>] section declares one bank-local program image. Drive A is
# VDrip proxy-backed, so no RAM disk seed image is embedded in ROM banks.

[payload.monitor]
name = Monitor
bank = 0
path = images/zephyr80_monitor.bin
entry = 0100h

[payload.bbc_basic]
name = BBC BASIC
bank = 1
path = images/BBCBASIC.COM
entry = 0100h
