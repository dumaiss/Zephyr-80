# Bank payload configuration for the generated Zephyr-80 image.
#
# Each [payload.<id>] section declares one bank-local program image. The RAM
# disk seed image is declared separately and occupies banks 2-7.

[payload.monitor]
name = Monitor
bank = 0
path = images/zephyr80_monitor.bin
entry = 0100h

[payload.bbc_basic]
name = BBC BASIC
bank = 1
path = images/BBCBASIC.COM
entry = 0100h

[ramdisk]
name = CP/M Drive A
path = images/zephyr80.cpm
fill = E5h
